<span class="logo-lg flex items-center gap-1">
  <!-- Official DataPallas wordmark (matches reportburster.com): Cormorant Garamond,
       "Data" italic in the inherited foreground colour, "Pallas" upright in the
       terracotta brand colour (hsl(18 55% 60%) ≈ #d18361). -->
  <span class="text-3xl tracking-tight"
        style="font-family:'Cormorant Garamond',ui-serif,Georgia,'Times New Roman',serif;font-weight:700;line-height:1;"><span style="font-style:italic;">Data</span><span style="color:#d18361;">Pallas</span></span>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="28" height="28"
       style="display: inline-block; vertical-align: -6px; margin-left: 3px; filter: drop-shadow(0px 1px 3px rgba(0,0,0,0.7));">
    <!-- Cornice — warm stone -->
    <rect x="32" y="56" width="192" height="14" fill="#f0e2c0"/>
    <!-- Frieze — vivid terracotta (strong contrast on dark) -->
    <rect x="32" y="70" width="192" height="22" fill="#c9603a"/>
    <!-- Architrave -->
    <rect x="32" y="92" width="192" height="8" fill="#e8d4a8"/>
    <!-- Capital line — gold -->
    <rect x="32" y="100" width="192" height="6" fill="#d4a843"/>
    <!-- 3 columns — bright warm white -->
    <rect x="44"  y="106" width="36" height="98" fill="#f8f2e8"/>
    <rect x="110" y="106" width="36" height="98" fill="#f8f2e8"/>
    <rect x="176" y="106" width="36" height="98" fill="#f8f2e8"/>
    <!-- column right-edge shadow -->
    <rect x="77"  y="106" width="5" height="98" fill="#b89858"/>
    <rect x="143" y="106" width="5" height="98" fill="#b89858"/>
    <rect x="209" y="106" width="3" height="98" fill="#b89858"/>
    <!-- base moulding — gold -->
    <rect x="32" y="204" width="192" height="6" fill="#d4a843"/>
    <!-- stylobate steps -->
    <rect x="20"  y="210" width="216" height="10" fill="#e8d4a8"/>
    <rect x="0"   y="220" width="256" height="14" fill="#c8a860"/>
  </svg>
</span>
