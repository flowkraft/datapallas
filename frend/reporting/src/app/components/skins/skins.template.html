<!-- Control Sidebar -->
<aside id="controlSidebar" class="control-sidebar control-sidebar-dark">
  <h4 class="control-sidebar-heading">
    {{ "COMPONENTS.SKINS.SKINS" | translate }}
  </h4>
  <div style="padding: 8px 8px 0 8px;">
    @for (theme of ALL_THEMES; track theme) {
      <button
        [id]="'theme-' + theme"
        type="button"
        (click)="setTheme(theme)"
        [attr.data-theme-active]="activeTheme === theme ? true : null"
        style="display: block; width: 100%; margin-bottom: 6px; padding: 6px 10px; text-align: left; cursor: pointer; border-radius: 4px; border: 2px solid transparent; text-transform: capitalize;"
        [style.border-color]="activeTheme === theme ? '#3c8dbc' : 'transparent'">
        {{ theme }}
      </button>
    }
  </div>
<br/><br/>
@if (settingsService.xmlInternalSettings?.documentburster?.settings) {

    style="margin: 10px 0 25px 0; clear: both; padding-left: 8px;">
    <label for="copilotUrl"><strong>AI Assistant URL</strong></label>
    <input id="copilotUrl" type="text" class="input"
      style="margin-top: 6px; width: calc(100% - 34px); display: inline-block;"
      [(ngModel)]="settingsService.xmlInternalSettings.documentburster.settings.copiloturl"
      (ngModelChange)="onInternalSettingsChanged.next($event)" placeholder="https://copilot.microsoft.com" />
    </div>
  }
