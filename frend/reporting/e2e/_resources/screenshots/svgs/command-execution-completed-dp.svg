<?xml version="1.0" encoding="UTF-8"?>
<!--
  Native "Info" message-box replica, DataPallas-branded (was: "...start again
  ReportBurster."). Reusable for the choco/java install-complete dialog that the
  OS shows during the quickstart prerequisite flow — not capturable from the DOM.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="190" viewBox="0 0 660 190"
     font-family="'Segoe UI', Tahoma, sans-serif">
  <!-- window -->
  <rect x="0.5" y="0.5" width="659" height="189" fill="#f0f0f0" stroke="#b4b4b4" stroke-width="1"/>

  <!-- title bar -->
  <rect x="1" y="1" width="658" height="30" fill="#ffffff"/>
  <text x="14" y="21" font-size="14" fill="#1b1b1b">Info</text>
  <!-- close X -->
  <g stroke="#5a5a5a" stroke-width="1.3">
    <line x1="632" y1="11" x2="644" y2="23"/>
    <line x1="644" y1="11" x2="632" y2="23"/>
  </g>
  <line x1="1" y1="31" x2="659" y2="31" stroke="#e2e2e2" stroke-width="1"/>

  <!-- info icon -->
  <g transform="translate(34,66)">
    <circle cx="20" cy="20" r="20" fill="#1c8adb"/>
    <circle cx="20" cy="11" r="3" fill="#ffffff"/>
    <rect x="17.5" y="17" width="5" height="16" rx="1" fill="#ffffff"/>
  </g>

  <!-- message -->
  <text x="92" y="78" font-size="15" fill="#1b1b1b">Command execution completed, you may want to close and</text>
  <text x="92" y="100" font-size="15" fill="#1b1b1b">start again DataPallas.</text>

  <!-- button bar -->
  <line x1="1" y1="143" x2="659" y2="143" stroke="#dcdcdc" stroke-width="1"/>
  <rect x="556" y="153" width="90" height="28" rx="2" fill="#e1e1e1" stroke="#adadad" stroke-width="1"/>
  <text x="601" y="172" font-size="14" fill="#1b1b1b" text-anchor="middle">OK</text>
</svg>
