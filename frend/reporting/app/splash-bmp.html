<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DataPallas</title>
  <style>
    /* Portable-extraction splash (rasterised to splash-dark.bmp). Colours match the
       daisyUI v5 'dark' theme (base-100 #1d232a) and the brand: "D" = foreground white,
       "P" = terracotta #d18361, temple icon from brand.component. */
    :root{
      --bg: #1d232a;       /* daisyUI dark base-100 */
      --dp-d: #e8ebf2;     /* dark base-content (the "Data" foreground) */
      --dp-p: #d18361;     /* brand terracotta (the "Pallas" colour) */
    }

    html,body{
      height:100%;
      margin:0;
      padding:0;
      display:flex;
      align-items:center;
      justify-content:center;
      background: var(--bg);
      overflow:hidden;
    }

    .viewport {
      width: 180px;
      height: 150px;
      display:flex;
      align-items:center;
      justify-content:center;
      box-sizing:border-box;
      pointer-events:none;
      user-select:none;
    }

    .mini {
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:6px;
    }

    .temple {
      width: 56px;
      height: 56px;
      display:block;
      filter: drop-shadow(0px 1px 2px rgba(0,0,0,0.5));
    }

    /* D italic + P upright monogram, Garamond — same treatment as the wordmark. */
    .dp {
      font-family: Georgia,'Times New Roman',serif;
      font-weight: 700;
      font-size: 60px;
      line-height: 1;
      letter-spacing: 1px;
    }
    .dp .d { font-style: italic; color: var(--dp-d); }
    .dp .p { font-style: normal; color: var(--dp-p); }
  </style>
</head>
<body>
  <div class="viewport" role="status">
    <div class="mini">
      <!-- Temple of Pallas Athena — identical artwork to brand.component. -->
      <svg class="temple" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DataPallas">
        <rect x="32" y="56" width="192" height="14" fill="#f0e2c0"/>
        <rect x="32" y="70" width="192" height="22" fill="#c9603a"/>
        <rect x="32" y="92" width="192" height="8" fill="#e8d4a8"/>
        <rect x="32" y="100" width="192" height="6" fill="#d4a843"/>
        <rect x="44"  y="106" width="36" height="98" fill="#f8f2e8"/>
        <rect x="110" y="106" width="36" height="98" fill="#f8f2e8"/>
        <rect x="176" y="106" width="36" height="98" fill="#f8f2e8"/>
        <rect x="77"  y="106" width="5" height="98" fill="#b89858"/>
        <rect x="143" y="106" width="5" height="98" fill="#b89858"/>
        <rect x="209" y="106" width="3" height="98" fill="#b89858"/>
        <rect x="32" y="204" width="192" height="6" fill="#d4a843"/>
        <rect x="20"  y="210" width="216" height="10" fill="#e8d4a8"/>
        <rect x="0"   y="220" width="256" height="14" fill="#c8a860"/>
      </svg>
      <div class="dp" aria-label="DP"><span class="d">D</span><span class="p">P</span></div>
    </div>
  </div>
</body>
</html>
