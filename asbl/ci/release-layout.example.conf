# The machines of a release round: an example of the settings file release-rehearsal.sh and release-orchestrator.sh read,
# RELEASE_REHEARSAL_CONF [/root/release-rehearsal.conf] on the CI host. That file is the host's, outside the repo, root's,
# mode 600 or 400, read as shell; copy into it the keys you need from here. A key it does not set takes the default
# written beside it below, so a host with no such file runs the release steps together, with VM a alone in 16.6.2's order.
# The same file holds the release round's other settings (RELEASE_FIXER, DRY_RUN_RED: asbl/ci/jenkins/release-rehearsal.sh).
#
# What reads these keys: asbl/ci/release-machines.sh (show, check, schedule: its header). Check a change before a round:
#   RELEASE_REHEARSAL_CONF=/root/release-rehearsal.conf bash asbl/ci/release-machines.sh check <N> <M>
# with N = SPLIT_E2E_FULL_SET_EXECUTION_INTO_N_PARALLEL_JOBS and M = USE_N_NUMBER_OF_WINDOWS_VMS, the job's Advanced
# (Parallelization) values (1 to 4 each, default 1).

# together: after step 0, steps 1, 2 and 3 start at once: step 1's full set in the runners (below), this host's own
# engine runs its parts one after another (it runs one DataPallas e2e set at a time), the VMs theirs beside it.
# in-order: 16.6.2's order, step 1 first, then steps 2 and 3, all on this host's engine: the off switch of every
# speedup (it allows N = 1 and M = 1 only, and starts no runner)
RELEASE_STEPS=together                 # default: together

# yes: with the steps together, step 1's full set runs in N runners at once (N = SPLIT_E2E_FULL_SET_EXECUTION_INTO_N_
# PARALLEL_JOBS; 1, the default, runs the whole full set in one runner), each a Docker engine of its own on this host
# (asbl/ci/e2e-runners.sh), all started when the build ends, each with its list of asbl/ci/full-set-runners.txt, while
# the host lanes' runner (runner 5) runs the auth file, then step 2's Linux proof. no: the full set runs whole on this host's engine
# after those two, as before the runners (about 12 h 10 instead of about 11 h 20 for 1 and 1): the fallback when a
# runner fails for its own reason (its engine did not start, out of memory, a pull refused). With no, N must be 1
RELEASE_RUNNERS=yes                    # default: yes

# each runner's memory ceiling, in GB (docker run --memory): it reserves nothing, a runner takes what it needs, and a
# runaway never takes the memory of other apps. Keep it well above the need: at 10 GB the full set stalled for hours with
# no failure. The memory rule counts a runner at RELEASE_SERVER_GB
RELEASE_RUNNER_LIMIT_GB=24             # default: 24

# the memory of one host test server (its server, its database containers, the browser); the memory rule counts N + 1 of
# them for a choice: with the runners, each runner and the host lanes' runner (the auth file, the Linux proof), at this
# only until a round's memory.log recorded their real peak; with RELEASE_RUNNERS=no, step 1's full set and step 2's server
RELEASE_SERVER_GB=5                    # default: 5

# the Windows VMs that exist, in order. VM a is the one of win-ci.env (WIN_CI_CONF); every other VM <name> has its own
# /root/win-ci-<name>.env with its WIN_HOST (read after win-ci.env, so the rest is shared). Name a VM here only once it
# exists: a round with more VMs than this list refuses to start
RELEASE_WINDOWS_VMS="a b c d"          # default: "a"

# one memory for every Windows VM, in GB, set on each before a round: a ceiling, not a reservation. Windows sees all of it,
# the host holds what Windows really uses (KSM, on before every round), and a VM gives it all back when it shuts down. A VM
# the round starts writes zeros over all of it first, so the press counts each one at this size
WIN_VM_MEMORY_GB=24                    # default: 24

# what the memory rule counts a VM at, in GB, until a round's memory.log recorded a VM's real peak
WIN_VM_DEFAULT_PEAK_GB=12              # default: 12

# the most Docker takes inside each VM, in GB, under WIN_VM_MEMORY_GB: Docker takes what it needs up to this.
# After changing it or WIN_VM_MEMORY_GB: bash asbl/ci/release-machines.sh vm-memory-setup
WIN_VM_DOCKER_MEMORY_GB=16             # default: 16

# the most the CI's own container dp-ci takes, in GB, on this host's engine or in a runner, under the runner's ceiling.
# What the tests start has no limit of its own: it runs as the e2e proved it, inside the runner or the VM
RELEASE_CI_CONTAINER_LIMIT_GB=12       # default: 12

# host memory that must stay free during a round, in GB: with less left, the job's form warns, and the press refuses.
# The memory a choice needs: (N + 1) x RELEASE_SERVER_GB, plus WIN_VM_MEMORY_GB for each VM the round starts.
RELEASE_MIN_FREE_GB=16                 # default: 16

# the disk: what /var keeps free at a press, in GB, after what the runners take there: about 40 GB for a runner with no
# volume yet (dp-ci-runner-<n>-docker: this host's images and caches copied in, its checkout copy), about 4 GB for one whose
# volume is there (the round's new images; docker volume rm dp-ci-runner-<n>-docker resets it). Under it the press refuses:
# the VMs' overlays and the run's reports grow there, and this host's apps share that disk
RELEASE_MIN_FREE_VAR_GB=50             # default: 50

# a swap in RAM for the length of a run, in GB: when RAM runs short, idle memory moves there compressed; it stays empty while
# RAM is enough. A ceiling, not a reservation. A run turns it on at its start and off at its end or stop. 0 = none
RELEASE_ZRAM_SWAP_GB=0                 # default: 0
# the most of RAM that swap takes, in GB
RELEASE_ZRAM_RAM_LIMIT_GB=64           # default: 64

# where release-rehearsal.sh estimate writes the 16 estimates (every N and M) that the job's form reads: the Jenkins home,
# outside userContent, so Jenkins does not serve it
#RELEASE_ESTIMATES_FILE=/var/kraft-internalsystems/apps/cvs/custom-jenkins/home/datapallas/release-estimates.json   # the default

# VM_LANES_<M>_<name>: the lanes VM <name> runs, in this order, when a round uses M VMs (the first M of
# RELEASE_WINDOWS_VMS). The lanes:
#   pack            step 3's pack (the Windows zips)
#   docker-proof    step 2's Windows Docker proof (it waits for the Linux build's image and docker zip)
#   server-light    step 3's server light set (it waits for the pack's datapallas-server.zip)
#   electron-light  step 3's Electron light set
#   robot           step 3's Robot (it installs the pack's zips)
# The rules, checked before anything starts: every lane runs once; Robot runs on the pack's VM, last there (it removes
# Java); when one VM runs both light sets, the server light set comes first (the Electron package empties asbl\dist).
# A VM with no key for M takes the default of its place in RELEASE_WINDOWS_VMS: the layouts below are those defaults.
VM_LANES_1_a="pack docker-proof server-light electron-light robot"   # one VM: 16.6.2's order
VM_LANES_2_a="pack server-light robot"
VM_LANES_2_b="docker-proof electron-light"
VM_LANES_3_a="pack server-light robot"
VM_LANES_3_b="docker-proof"
VM_LANES_3_c="electron-light"
VM_LANES_4_a="pack robot"
VM_LANES_4_b="server-light"
VM_LANES_4_c="electron-light"
VM_LANES_4_d="docker-proof"                                           # the longest lane, alone on its VM

# VM_DOMAIN_<name>: the VM's libvirt name, for virsh (starting, stopping, its memory); the defaults: VM a is win10-dev,
# any other VM <name> is win10-dev-<name>
#VM_DOMAIN_b=win10-dev-b
