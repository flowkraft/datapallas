  #   healthcheck:
  #     test: ["CMD-SHELL", "curl -f http://localhost:8083/connectors || exit 1"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 60s

  # ===================================================================
  # DBT TRANSFORM SERVICE (DISABLED BY DEFAULT)
  # ===================================================================
  # Transforms raw OLTP data in ClickHouse into OLAP star schema
  # (fact + dimension tables) using dbt Core + dbt-clickhouse adapter.
  #
  # This is a CLI tool (runs and exits), NOT a long-running service.
  # Usage:
  #   docker compose run dbt-transform run       # Run all models
  #   docker compose run dbt-transform test      # Run tests
  #   docker compose run dbt-transform debug     # Test connection
  #
  # PREREQUISITES:
  # - ClickHouse running with raw OLTP tables loaded
  #   (via Java initialization OR CDC sink connector replication)
  #
  # See CONFIGURE_ETL.md for detailed setup instructions.
  # ===================================================================

  # dbt-transform:
