  #     - DATABASE_PORT=3306                      # 3306 for MySQL, 5432 for PostgreSQL
  #     - DATABASE_USER=replicator
  #     - DATABASE_PASSWORD=repl_password         # CHANGE THIS!
  #     - DATABASE_NAME=your_database
