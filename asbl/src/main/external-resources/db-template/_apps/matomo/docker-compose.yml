version: "3.9"

services:
  matomo:
    image: nginx:alpine3.22
    container_name: rb-matomo
    depends_on: 
      - matomo-fpm
    ports:
      - "${HOST_PORT:-8081}:8080"
    volumes:
      - matomo_html:/var/www/html
      # Override nginx default.conf with your custom config
      - ./config/matomo.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/index.php"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  matomo-fpm:
    image: matomo:5.6.1-fpm-alpine
    container_name: rb-matomo-fpm
    depends_on:
      matomo-db:
        condition: service_healthy
    volumes:
      - matomo_html:/var/www/html
      # Uncomment if you want to persist config/logs on host
      # - ./config:/var/www/html/config
      # - ./logs:/var/www/html/logs
    environment:
      - MATOMO_DATABASE_HOST=matomo-db
      - PHP_MEMORY_LIMIT=2048M
    env_file:
      - ./config/.env
    restart: unless-stopped

  matomo-db:
    image: mariadb:10.11
    container_name: rb-matomo-db
    # A database gets a real shutdown window. Compose defaults to 10s and then SIGKILLs, and a
    # hard-killed server replays its write-ahead log on the NEXT boot - so every rushed stop makes
    # the following start slower, which makes the next stop more likely to be rushed. The e2e suite
    # stops and starts these apps repeatedly, so the loop compounds across a run.
    stop_grace_period: 60s
    command: --max-allowed-packet=64MB
    volumes:
      - matomo_data:/var/lib/mysql
    env_file:
      - ./config/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  matomo_html:
  matomo_data:

# One network for everything DataPallas runs, so the server reaches this app by its container name instead
# of going out to the host and back in through a published port - which any host firewall may block (plan
# §4 F2n). The name is fixed but the network is not 'external': compose creates it when it is missing, so
# this file still works on its own.
networks:
  default:
    name: datapallas
