services:
  rundeck:
    image: rundeck/rundeck:5.17.0
    container_name: rb-rundeck
    tty: true
    volumes:
      - data:/home/rundeck/server/data
      # - ${RUNDECK_LICENSE_FILE:-/dev/null}:/home/rundeck/etc/rundeckpro-license.key
    ports:
      - "${HOST_PORT:-4440}:4440"
    restart: unless-stopped
    healthcheck:
      # Uses curl to check the API system info endpoint.
      # The '-f' flag makes curl return a non-zero exit code on HTTP errors (4xx or 5xx), which Docker interprets as "unhealthy".
      test: ["CMD-SHELL", "curl http://localhost:4440|| exit 1"]
      interval: 5s    
      timeout: 5s     
      retries: 30       
      start_period: 10s

volumes:
  data:

# One network for everything DataPallas runs, so the server reaches this app by its container name instead
# of going out to the host and back in through a published port - which any host firewall may block (plan
# §4 F2n). The name is fixed but the network is not 'external': compose creates it when it is missing, so
# this file still works on its own.
networks:
  default:
    name: datapallas
