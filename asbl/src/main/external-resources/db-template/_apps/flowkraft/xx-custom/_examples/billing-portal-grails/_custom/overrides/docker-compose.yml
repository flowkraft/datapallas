version: '3.8'

services:
  billing-portal-grails:
    # The SQLite file lives in the bind-mounted ../_shared-db, which on Linux belongs to whoever
    # unpacked DataPallas (root in CI) while the image runs as its own user — the app then died
    # with SQLITE_CANTOPEN and never became healthy. Docker Desktop (Windows/macOS) does not
    # enforce bind-mount ownership, so there nothing changes.
    user: "0:0"
    build:
      context: .
      dockerfile: Dockerfile
    container_name: billing-portal-grails
    ports:
      - "${HOST_PORT:-8500}:8080"
    environment:
      - SERVER_PORT=8080
      - GRAILS_ENV=production
      - DB_PATH=/app/data/grails-portal.db
      - DB_CREATE=update
      - JAVA_OPTS=-Xmx512m -Xms256m
    volumes:
      # The SQLite DB file lives in the shared dir so billing-portal-bkend can maintain it directly.
      - ../_shared-db:/app/data
      - billing-portal-grails-logs:/app/logs
      # DataPallas config, read-only - this is where the app reads config/_internal/api-key.txt.
      # Without it the app calls DataPallas with no API key, a DataPallas Server rejects the call and
      # every embedded component renders empty. The blueprint this app was copied from mounts it; that
      # line was lost when these overrides replaced the blueprint compose wholesale. Five levels up,
      # not three, because a scaffolded app sits under xx-custom/_examples/<app>/ - two deeper than
      # the blueprint (see billing-portal-bkend, which walks the same five for ../../../../../db).
      - ../../../../../config:/app/config:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

volumes:
  billing-portal-grails-logs:

networks:
  # Was 'flowkraft-network', which only these two files ever named. They are on the one network everything
  # DataPallas runs shares now, so the server reaches them by container name instead of through a published
  # host port, which any host firewall may block (plan §4 F2n). They still reach each other by name here.
  default:
    name: datapallas
