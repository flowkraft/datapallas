services:
  billing-portal-bkend:
    # The SQLite file lives in the bind-mounted ../_shared-db, which on Linux belongs to whoever
    # unpacked DataPallas (root in CI) while the image runs as its own user — the app then died
    # with SQLITE_CANTOPEN and never became healthy. Docker Desktop (Windows/macOS) does not
    # enforce bind-mount ownership, so there nothing changes.
    user: "0:0"
    build:
      context: .
      dockerfile: Dockerfile
    image: billing-portal-bkend:latest
    container_name: billing-portal-bkend
    ports:
      - "${HOST_PORT:-8502}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - ENABLE_LIQUIBASE_GROOVY_MIGRATIONS=${ENABLE_LIQUIBASE_GROOVY_MIGRATIONS:-false}
      - DDL_AUTO=${DDL_AUTO:-update}
      - DB_PATH=/app/db/sample-northwind-sqlite/northwind.db
      # Mark-overdue schedule (Spring cron). Default hourly; it also runs once on startup.
      - BP_CRON_MARK_OVERDUE=${BP_CRON_MARK_OVERDUE:-0 0 * * * *}
    volumes:
      # Blueprint's shared northwind db (foundation — kept as-is; this app sits one level deeper).
      - ../../../../../db:/app/db
      # The billing portals' SQLite DB files — the cron opens them directly to mark invoices overdue.
      - ../_shared-db:/app/shared
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

# One network for everything DataPallas runs, so the server reaches this app by its container name instead
# of going out to the host and back in through a published port - which any host firewall may block (plan
# §4 F2n). The name is fixed but the network is not 'external': compose creates it when it is missing, so
# this file still works on its own.
networks:
  default:
    name: datapallas
