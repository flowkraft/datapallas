# AI Crew Development Stack
# This is a development helper service, not part of the main production apps
# Run separately from the main flowkraft services (keycloak, admin, etc.)

services:
  # ============================================
  # Frontend Applications
  # ============================================

  ai-hub-frend:
    container_name: flowkraft-ai-hub-frend
    build:
      context: ./ui-startpage
      dockerfile: Dockerfile
    depends_on:
      letta:
        condition: service_healthy
      element-web:
        condition: service_started
      chat2db:
        condition: service_started
      baibot:
        condition: service_started
      code-server:
        condition: service_started
    # The AI Hub now reaches the DataPallas backend from its own server side (the /api/dp proxy)
    # instead of from the user's browser, so the CONTAINER has to be able to resolve the host.
    # Docker Desktop provides host.docker.internal automatically; plain Linux Docker does not, and
    # without this line Explore Data would simply stop loading there.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production
      - LETTA_BASE_URL=http://flowkraft-ai-hub-letta:8283
      - LETTA_API_KEY=${LETTA_API_KEY:-}
      - NEXT_PUBLIC_AGENTS_CHAT_URL=${NEXT_PUBLIC_AGENTS_CHAT_URL:-http://localhost:8441}
      - ELEMENT_URL=http://flowkraft-ai-hub-element-web:80
      - CODE_SERVER_URL=http://localhost:8442
      - CHAT2DB_URL=http://flowkraft-ai-hub-chat2db:8888
      # Where the DataPallas backend is, AS SEEN FROM THIS CONTAINER — a container's own localhost
      # is the container, not the host. This is the only DataPallas setting the AI Hub needs: it
      # holds no credential of its own and forwards the caller's session instead.
      - DP_API_URL=${DP_API_URL:-http://host.docker.internal:9090/api}
      # LLM provider config (needed by provision route env check)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_API_BASE=${OPENAI_API_BASE:-}
      # Matrix provisioner config (for automated room setup)
      - MATRIX_HOMESERVER_URL=http://flowkraft-ai-hub-matrix-synapse:8008
      - MATRIX_SERVER_NAME=localhost
      - MATRIX_REGISTRATION_SECRET=${MATRIX_REGISTRATION_SECRET:-6180e53cc7b443e691d1bfc93c83bf2d60c8ee90a0db4bb194d74db52dd6f6cd}
    ports:
      - "8440:3000"  # AI Hub Dashboard UI
    volumes:
      # Persist SQLite database across container restarts
      - ai-hub-data:/app/data
      # Custom tools needed by agent provisioner (Python files registered in Letta)
      - ./custom-tools:/custom-tools:ro
      # Agent output artifacts — browsed by the workspace UI (read-only)
      - ./agents-output-artifacts:/app/workspace/agents-output-artifacts:ro
      # Mount _ai-hub/ so update-env can read .env.example and write .env to host
      - .:/ai-hub
    restart: unless-stopped
    networks:
      - ai-hub-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', (r) => process.exit(r.statusCode >= 200 && r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  ai-hub-tools:
    build:
      context: ./ui-startpage
      dockerfile: Dockerfile
      target: builder
    container_name: flowkraft-ai-hub-tools
    working_dir: /app
    environment:
      - LETTA_BASE_URL=http://flowkraft-ai-hub-letta:8283
      - LETTA_API_KEY=${LETTA_API_KEY:-}
    volumes:
      - ./custom-tools:/custom-tools
      - ./agents-output-artifacts:/agent-output-artifacts
    # No entrypoint - for running CLI commands like: docker compose run --rm ai-hub-tools npm run agents:list
    tty: true
    stdin_open: true
    networks:
      - ai-hub-network

  # ============================================
  # AI Backend Services
  # ============================================

  letta:
    build:
      context: .
      dockerfile: helpers/letta/Dockerfile
    container_name: flowkraft-ai-hub-letta
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      # LLM provider API keys (each activates its native Letta provider)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Default MUST be the real OpenAI URL, not empty: pydantic takes an empty env var over
      # its default, and Letta flips the handle prefix to "openai-proxy" (and GETs ""/models,
      # which fails) whenever base_url != "https://api.openai.com/v1" — so an empty value
      # kills the plain-OpenAI provider entirely. ":-" also covers the set-but-empty case.
      - OPENAI_API_BASE=${OPENAI_API_BASE:-https://api.openai.com/v1}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ZAI_API_KEY=${ZAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OLLAMA_BASE_URL=http://flowkraft-ai-hub-ollama:11434
      # Letta clamps every agent's context window to this ceiling at creation
      # (ModelSettings.global_max_context_window_limit — no env_prefix, so the field
      # name is the env var verbatim). Set to glm-5.2's real 200K window; Letta's
      # built-in 32000 default would otherwise cap both the main and sleeptime agents.
      - GLOBAL_MAX_CONTEXT_WINDOW_LIMIT=200000
      - AUTO_APPROVE_SHELL_COMMANDS=false
      - POSTGRES_USER=letta
      - POSTGRES_PASSWORD=${LETTA_DB_PASSWORD:-letta}
      - POSTGRES_DB=letta
    volumes:
      - letta-data:/var/lib/postgresql/data
      # DataPallas installation root - all agent resources accessed from here
      # Set DATAPALLAS_INSTALLATION_FOLDER to your DataPallas installation path
      # Example: DATAPALLAS_INSTALLATION_FOLDER=C:\datapallas or /opt/datapallas
      #
      # Agents access everything via /datapallas:
      # - Skills: /datapallas/_apps/flowkraft/_ai-hub/.skills
      # - Agent output artifacts: /datapallas/_apps/flowkraft/_ai-hub/agents-output-artifacts
      # - WordPress portal: /datapallas/_apps/cms-webportal-playground
      # - Grails playground: /datapallas/_apps/flowkraft/grails-playground
      # - Next.js playground: /datapallas/_apps/flowkraft/next-playground
      # - Backend playground: /datapallas/_apps/flowkraft/bkend-boot-groovy-playground
      - ${DATAPALLAS_INSTALLATION_FOLDER:-../../..}:/datapallas
    # Ports commented - internal services accessed via ai-hub-network
    # Uncomment only if you need direct external access for debugging
    # ports:
    #   - "8283:8283"  # Letta API
    #   - "5432:5432"  # PostgreSQL
    #   - "6379:6379"  # Redis
    restart: unless-stopped
    networks:
      - ai-hub-network
    healthcheck:
      # Use /v1/providers/ endpoint since /health doesn't exist in current Letta version
      test: ["CMD-SHELL", "curl -sf http://localhost:8283/v1/providers/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  ollama:
    image: ollama/ollama:0.13.5
    container_name: flowkraft-ai-hub-ollama
    volumes:
      - ollama-data:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # Start Ollama server in background
        /bin/ollama serve &
        OLLAMA_PID=$!

        # Wait for Ollama API to be ready (max 30 seconds)
        echo "Waiting for Ollama to start..."
        for i in $(seq 1 30); do
          if /bin/ollama list >/dev/null 2>&1; then
            echo "Ollama is ready!"
            break
          fi
          sleep 1
        done

        # Verify Ollama is actually running
        if ! /bin/ollama list >/dev/null 2>&1; then
          echo "ERROR: Ollama failed to start"
          exit 1
        fi

        # Pull embedding model (skips if already present)
        echo "Ensuring mxbai-embed-large is available..."
        if /bin/ollama pull mxbai-embed-large; then
          echo "Model ready: mxbai-embed-large"
        else
          echo "WARNING: Failed to pull model, but continuing if model exists locally"
        fi

        # Keep container running and wait for Ollama process
        echo "Ollama container ready"
        wait $OLLAMA_PID
    restart: unless-stopped
    # Gate health on the EMBEDDING MODEL being pulled, not just the server answering. `ollama
    # list` succeeds the moment the server is up (with an empty list), so the old check reported
    # "healthy" while the 670MB pull was still running — and Letta (depends_on: service_healthy)
    # would boot, sync an EMPTY ollama model list, register 0 embedding models, and every agent
    # provision then failed "Embedding model ollama/mxbai-embed-large:latest not found". Grepping
    # for the model makes "healthy" mean "model is actually ready", so Letta only syncs once it's
    # present. start_period covers the pull on a fresh (wiped) volume before it counts as failed.
    healthcheck:
      test: ["CMD-SHELL", "/bin/ollama list | grep -q mxbai-embed-large"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 300s
    networks:
      - ai-hub-network

  # ============================================
  # Chat & Collaboration Services
  # ============================================

  baibot:
    build:
      context: ./helpers/baibot
      dockerfile: Dockerfile
    container_name: flowkraft-ai-hub-baibot
    depends_on:
      letta:
        condition: service_healthy
      matrix-synapse:
        condition: service_healthy
    environment:
      - BAIBOT_SEND_N_NEWEST_MESSAGES=1
      - BAIBOT_CONFIG_FILE_PATH=/app/config.yml
      - BAIBOT_PERSISTENCE_DATA_DIR_PATH=/data
    volumes:
      - ./config/baibot/config.yml:/app/config.yml:ro
      - baibot-data:/data
    restart: unless-stopped
    networks:
      - ai-hub-network

  matrix-synapse:
    image: ghcr.io/element-hq/synapse:v1.131.0
    container_name: flowkraft-ai-hub-matrix-synapse
    depends_on:
      matrix-synapsedb-postgres:
        condition: service_healthy
    environment:
      - SYNAPSE_CONFIG_PATH=/data/homeserver.yaml
      - DB_USER=${DB_USER:-synapse}
      - DB_PASSWORD=${DB_PASSWORD:-synapse}
    volumes:
      - ./config/synapse:/data
      - synapse-data:/data/media_store
    # Element Web runs in the browser, so the browser needs to reach Synapse
    # via localhost — this port MUST be exposed for Element Web to work
    ports:
      - "8008:8008"  # Matrix Synapse API (required by Element Web in browser)
    restart: unless-stopped
    networks:
      - ai-hub-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8008/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  element-web:
    image: vectorim/element-web:v1.11.102
    container_name: flowkraft-ai-hub-element-web
    depends_on:
      matrix-synapse:
        condition: service_healthy
    volumes:
      - ./config/element/config.json:/app/config.json:ro
    ports:
      - "8441:80"  # Element Web Chat UI
    restart: unless-stopped
    networks:
      - ai-hub-network

  # ============================================
  # Database Services
  # ============================================

  matrix-synapsedb-postgres:
    image: postgres:17-alpine
    container_name: flowkraft-ai-hub-matrix-db
    volumes:
      - synapse-db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-synapse}
      POSTGRES_USER: ${DB_USER:-synapse}
      POSTGRES_DB: matrix-synapsedb
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_INITDB_ARGS: '--lc-collate=C --lc-ctype=C --encoding=UTF8'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-synapse} -d matrix-synapsedb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ai-hub-network

  code-server:
    container_name: flowkraft-ai-hub-code-server
    build:
      context: ../__devcontainer
      dockerfile: Dockerfile.code-server
    command: >-
      bash -c "git config --global user.name 'flowkraft' &&
               git config --global user.email 'virgil.trasca@gmail.com' &&
               code-server --bind-addr 0.0.0.0:8443 --auth none"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      # DataPallas project (full repo)
      - ${DATAPALLAS_INSTALLATION_FOLDER:-../../..}:/datapallas

      # Workspace files with color configurations
      - ../__devcontainer/workspaces:/workspaces

      # Claude authentication persistence (survives docker compose down -v)
      - /var/kraft-internalsystems/apps/cvs/shelf-code-server/config/.claude:/root/.claude
    ports:
      - "8442:8443"  # Code Server (VS Code in browser)
    restart: unless-stopped
    networks:
      - ai-hub-network

  # ============================================
  # Chat2DB - Data Analysis Lab (Natural Language SQL via FastAPI)
  # ============================================
  chat2db:
    build:
      context: ./helpers/chat2db
      dockerfile: Dockerfile
    container_name: flowkraft-ai-hub-chat2db
    depends_on:
      letta:
        condition: service_healthy
    environment:
      # Athena AI via OpenAI-compatible adapter (ai-hub-frend wraps Letta agents)
      - OPENAI_API_BASE=http://flowkraft-ai-hub-frend:3000/api/openai/athena/v1
      - OPENAI_MODEL=letta:athena
    volumes:
      # DataPallas root — Python code derives all paths from /datapallas
      # (config/connections, lib, db) via hardcoded defaults in rb_connections.py
      - ${DATAPALLAS_INSTALLATION_FOLDER:-../../..}:/datapallas:ro
    # No port exposed — accessed only by ai-hub-frend via Docker network
    restart: unless-stopped
    networks:
      - ai-hub-network

networks:
  ai-hub-network:
    driver: bridge

volumes:
  ai-hub-data:
  letta-data:
  ollama-data:
  baibot-data:
  synapse-data:
  synapse-db-data:
