<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 540">
  <!-- Apollo, talking — standing sun god (Next.js & modern web). MALE, youthful (kouros):
       SHORT golden curls with visible ears + sideburns, gold laurel wreath, SHORT white
       chiton with gold sash/hem (athletic — bare legs, plain sandals), the lyre in hand.
       Same 400x540 skeleton + flat outlined style as mnemosyne-talking.svg
       (skin #fce8d4, ink #2a1a10 w2, gold #d4af37). -->

  <!-- Head + short golden curls (no long side locks) -->
  <ellipse cx="200" cy="172" rx="55" ry="72" fill="#fce8d4"/>
  <ellipse cx="145" cy="180" rx="6" ry="10" fill="#fce8d4"/>
  <ellipse cx="255" cy="180" rx="6" ry="10" fill="#fce8d4"/>
  <path d="M 148 128 Q 142 74 200 68 Q 258 74 252 128 Q 246 106 230 100 Q 236 116 220 110 Q 204 92 180 104 Q 164 96 170 112 Q 154 108 148 128 Z" fill="#e2b84e"/>
  <path d="M 200 68 Q 258 74 252 128 Q 246 106 230 100 Q 244 82 200 68 Z" fill="#c89a3c" fill-opacity="0.55"/>
  <!-- Short sideburns in front of the ears -->
  <circle cx="148" cy="152" r="6" fill="#e2b84e"/>
  <circle cx="252" cy="152" r="6" fill="#e2b84e"/>

  <!-- Gold laurel wreath -->
  <path d="M 158 116 Q 200 94 242 116" stroke="#d4af37" stroke-width="3" fill="none"/>
  <ellipse cx="172" cy="109" rx="9" ry="4" fill="#d4af37" transform="rotate(-30 172 109)"/>
  <ellipse cx="190" cy="99" rx="9" ry="4" fill="#d4af37" transform="rotate(-12 190 99)"/>
  <ellipse cx="210" cy="99" rx="9" ry="4" fill="#d4af37" transform="rotate(12 210 99)"/>
  <ellipse cx="228" cy="109" rx="9" ry="4" fill="#d4af37" transform="rotate(30 228 109)"/>

  <!-- Neck -->
  <path d="M 184 240 L 184 290 L 216 290 L 216 240 Z" fill="#fce8d4"/>

  <!-- SHORT white chiton: torso + gold sash + gold shoulder fibula -->
  <path d="M 158 290 Q 200 285 242 290 L 250 383 L 150 383 Z" fill="#f8f8f0"/>
  <path d="M 236 291 L 252 300 L 168 383 L 152 376 Z" fill="#d4af37" fill-opacity="0.75"/>
  <circle cx="237" cy="295" r="4" fill="#d4af37"/>
  <rect x="150" y="375" width="100" height="9" fill="#d4af37" fill-opacity="0.85"/>

  <!-- Short skirt with gold hem (knee-length — athletic) -->
  <path d="M 150 384 Q 143 416 140 446 L 260 446 Q 257 416 250 384 Z" fill="#f8f8f0"/>
  <path d="M 140 438 Q 200 442 260 438 L 260 446 L 140 446 Z" fill="#d4af37" fill-opacity="0.7"/>

  <!-- Legs -->
  <path d="M 165 446 L 187 446 L 184 514 L 168 514 Z" fill="#fce8d4"/>
  <path d="M 213 446 L 235 446 L 232 514 L 216 514 Z" fill="#fce8d4"/>

  <!-- Feet + plain sandals -->
  <ellipse cx="176" cy="521" rx="13" ry="6" fill="#fce8d4"/>
  <ellipse cx="224" cy="521" rx="13" ry="6" fill="#fce8d4"/>
  <ellipse cx="176" cy="525" rx="14" ry="5" fill="#a87c52"/>
  <ellipse cx="224" cy="525" rx="14" ry="5" fill="#a87c52"/>

  <!-- The lyre (held at his right side) -->
  <ellipse cx="285" cy="412" rx="20" ry="15" fill="#c8a850"/>
  <ellipse cx="285" cy="410" rx="13" ry="9" fill="#e4cd88"/>
  <path d="M 270 402 Q 258 372 268 342" stroke="#c8a850" stroke-width="5" fill="none"/>
  <path d="M 300 402 Q 312 372 302 342" stroke="#c8a850" stroke-width="5" fill="none"/>
  <line x1="264" y1="342" x2="306" y2="342" stroke="#c8a850" stroke-width="4"/>
  <line x1="275" y1="346" x2="277" y2="401" stroke="#f5ecd0" stroke-width="1.2"/>
  <line x1="282" y1="346" x2="283" y2="403" stroke="#f5ecd0" stroke-width="1.2"/>
  <line x1="289" y1="346" x2="288" y2="403" stroke="#f5ecd0" stroke-width="1.2"/>
  <line x1="296" y1="346" x2="293" y2="401" stroke="#f5ecd0" stroke-width="1.2"/>

  <!-- Blush -->
