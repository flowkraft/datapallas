    <ellipse cx="190" cy="99" rx="9" ry="4" stroke="#a8842a" transform="rotate(-12 190 99)" stroke-width="1.4"/>
    <ellipse cx="210" cy="99" rx="9" ry="4" stroke="#a8842a" transform="rotate(12 210 99)" stroke-width="1.4"/>
    <ellipse cx="228" cy="109" rx="9" ry="4" stroke="#a8842a" transform="rotate(30 228 109)" stroke-width="1.4"/>
    <path d="M 184 240 Q 184 275 178 290"/>
    <path d="M 216 240 Q 216 275 222 290"/>
    <path d="M 158 290 Q 200 285 242 290"/>
    <path d="M 236 291 L 252 300 L 168 383 L 152 376" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle cx="237" cy="295" r="4"/>
    <path d="M 150 290 L 150 383"/>
    <path d="M 250 290 L 250 383"/>
    <line x1="150" y1="375" x2="250" y2="375"/>
    <line x1="150" y1="384" x2="250" y2="384"/>
    <path d="M 150 384 Q 143 416 140 446"/>
