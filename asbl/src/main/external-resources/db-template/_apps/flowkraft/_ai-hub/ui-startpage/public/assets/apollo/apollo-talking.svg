    <ellipse cx="285" cy="412" rx="20" ry="15"/>
    <ellipse cx="285" cy="410" rx="13" ry="9" stroke-width="1.4" stroke-opacity="0.6"/>
    <path d="M 270 402 Q 258 372 268 342"/>
    <path d="M 300 402 Q 312 372 302 342"/>
    <line x1="264" y1="342" x2="306" y2="342"/>
    <!-- Left arm gesturing out (talking) -->
    <path d="M 152 305 Q 115 340 100 395" stroke="#fce8d4" stroke-width="14"/>
    <path d="M 152 305 Q 115 340 100 395"/>
    <ellipse cx="98" cy="405" rx="11" ry="9" fill="#fce8d4"/>
    <ellipse cx="98" cy="405" rx="11" ry="9"/>
    <line x1="92" y1="403" x2="89" y2="398"/>
    <line x1="98" y1="400" x2="98" y2="394"/>
    <line x1="104" y1="403" x2="107" y2="398"/>
    <!-- Right arm holding the lyre -->
    <path d="M 248 305 Q 264 350 272 392" stroke="#fce8d4" stroke-width="14"/>
    <path d="M 248 305 Q 264 350 272 392"/>
    <ellipse cx="276" cy="400" rx="11" ry="9" fill="#fce8d4"/>
    <ellipse cx="276" cy="400" rx="11" ry="9"/>
    <line x1="270" y1="398" x2="268" y2="393"/>
    <line x1="282" y1="398" x2="284" y2="393"/>
    <!-- Eyes: open engaged almond (golden-brown iris) -->
    <path d="M 165 168 Q 180 160 197 168 Q 192 180 180 180 Q 170 178 165 168 Z" fill="#fff"/>
    <ellipse cx="181" cy="172" rx="7" ry="7" fill="#8a6420" stroke="none"/>
    <circle cx="183" cy="170" r="3" fill="#1a0a05" stroke="none"/>
    <circle cx="185" cy="168" r="1.2" fill="#fff" stroke="none"/>
    <path d="M 203 168 Q 220 160 235 168 Q 230 180 220 180 Q 208 178 203 168 Z" fill="#fff"/>
    <ellipse cx="219" cy="172" rx="7" ry="7" fill="#8a6420" stroke="none"/>
    <circle cx="221" cy="170" r="3" fill="#1a0a05" stroke="none"/>
    <circle cx="223" cy="168" r="1.2" fill="#fff" stroke="none"/>
    <line x1="166" y1="166" x2="168" y2="162"/>
    <line x1="232" y1="162" x2="234" y2="166"/>
    <!-- Straighter masculine brows -->
    <path d="M 161 151 Q 180 144 198 149" stroke-width="2.6"/>
    <path d="M 202 149 Q 220 144 239 151" stroke-width="2.6"/>
    <path d="M 200 180 Q 198 200 202 208 Q 205 210 207 207"/>
    <ellipse cx="196" cy="207" rx="1.5" ry="1" fill="#2a1a10" fill-opacity="0.5"/>
    <ellipse cx="204" cy="207" rx="1.5" ry="1" fill="#2a1a10" fill-opacity="0.5"/>
    <!-- Mouth: open talking -->
    <ellipse cx="200" cy="222" rx="9" ry="5" fill="#a04050"/>
    <ellipse cx="200" cy="222" rx="9" ry="5"/>
    <line x1="192" y1="222" x2="208" y2="222" stroke-opacity="0.5"/>
