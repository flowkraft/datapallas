<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Pythia — the Oracle of Delphi (WordPress portals). Violet veil (himation) over dark
       hair, gold forehead band with amethyst, faint oracle vapors.
       Same flat outlined style as athena/mnemosyne-talking.svg:
       skin #fce8d4, ink #2a1a10 w2, blush #e89080, gold #d4af37. -->
  <defs>
    <clipPath id="pythia-disc"><circle cx="100" cy="100" r="96"/></clipPath>
  </defs>

  <circle cx="100" cy="100" r="96" fill="#f2ecfb"/>

  <g clip-path="url(#pythia-disc)">
    <!-- Faint rising oracle vapors -->
    <g stroke="#b9a3e0" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.55">
      <path d="M 30 150 Q 24 132 32 118 Q 40 106 34 92"/>
      <path d="M 170 150 Q 176 132 168 118 Q 160 106 166 92"/>
    </g>
    <!-- Veil back drop (behind face, frames the head) -->
    <path d="M 46 108 Q 44 34 100 28 Q 156 34 154 108 Q 154 142 146 160 L 54 160 Q 46 142 46 108 Z" fill="#9b7ed0"/>
    <!-- Shoulders: violet drape over a light under-chiton -->
    <path d="M 32 200 Q 38 160 76 148 Q 100 142 124 148 Q 162 160 168 200 Z" fill="#8b6fc6"/>
    <path d="M 84 148 Q 100 156 116 148 L 112 170 Q 100 176 88 170 Z" fill="#efe9f9"/>
    <!-- Neck -->
    <path d="M 88 126 L 88 150 Q 100 157 112 150 L 112 126 Z" fill="#fce8d4"/>
    <ellipse cx="100" cy="131" rx="13" ry="5" fill="#f4d8c4"/>
    <!-- Face -->
    <ellipse cx="100" cy="92" rx="38" ry="46" fill="#fce8d4"/>
    <!-- Dark hair peeking under the veil, center-parted -->
    <path d="M 64 78 Q 70 60 100 58 Q 130 60 136 78 Q 118 66 100 66 Q 82 66 64 78 Z" fill="#2a1a10"/>
    <!-- Veil crown crossing over the top of the head -->
    <path d="M 60 76 Q 58 38 100 34 Q 142 38 140 76 Q 132 52 100 50 Q 68 52 60 76 Z" fill="#9b7ed0"/>
    <path d="M 100 34 Q 142 38 140 76 Q 134 58 118 52 Q 130 42 100 34 Z" fill="#7a5fc0" fill-opacity="0.5"/>
    <!-- Gold delphic band + amethyst on the veil -->
    <path d="M 66 62 Q 100 46 134 62" stroke="#d4af37" stroke-width="3.5" fill="none"/>
    <circle cx="100" cy="52" r="4.5" fill="#8b5cf6"/>
    <circle cx="101.5" cy="50.5" r="1.2" fill="#ffffff"/>
    <!-- Blush -->
    <ellipse cx="72" cy="104" rx="7" ry="3.5" fill="#e89080" fill-opacity="0.4"/>
    <ellipse cx="128" cy="104" rx="7" ry="3.5" fill="#e89080" fill-opacity="0.4"/>
  </g>

  <!-- Ink outline pass -->
  <g clip-path="url(#pythia-disc)" stroke="#2a1a10" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M 46 108 Q 44 34 100 28 Q 156 34 154 108 Q 154 142 146 160"/>
    <path d="M 46 108 Q 46 142 54 160"/>
    <path d="M 32 200 Q 38 160 76 148 Q 100 142 124 148 Q 162 160 168 200"/>
    <path d="M 84 148 Q 100 156 116 148 L 112 170 Q 100 176 88 170 Z"/>
    <path d="M 88 126 L 88 150 Q 100 157 112 150 L 112 126"/>
    <ellipse cx="100" cy="92" rx="38" ry="46"/>
    <path d="M 64 78 Q 70 60 100 58 Q 130 60 136 78" stroke-width="1.6" stroke-opacity="0.8"/>
    <line x1="100" y1="58" x2="100" y2="66" stroke-width="1.4" stroke-opacity="0.6"/>
    <path d="M 60 76 Q 58 38 100 34 Q 142 38 140 76"/>
    <path d="M 60 76 Q 68 52 100 50 Q 132 52 140 76"/>
    <path d="M 66 62 Q 100 46 134 62" stroke="#d4af37" stroke-width="3.5"/>
    <circle cx="100" cy="52" r="4.5"/>
    <!-- Veil side-fold lines -->
    <path d="M 52 96 Q 50 124 58 150" stroke-opacity="0.5" stroke-width="1.5"/>
    <path d="M 148 96 Q 150 124 142 150" stroke-opacity="0.5" stroke-width="1.5"/>
    <!-- Eyes: deep violet-brown iris, serene -->
    <path d="M 74 88 Q 84 82 95 88 Q 91 96 83 96 Q 77 94 74 88 Z" fill="#ffffff"/>
    <ellipse cx="85" cy="90" rx="4.8" ry="4.8" fill="#4a3260" stroke="none"/>
    <circle cx="86.5" cy="88.8" r="2.2" fill="#1a0a05" stroke="none"/>
    <circle cx="87.6" cy="87.6" r="0.9" fill="#ffffff" stroke="none"/>
    <path d="M 105 88 Q 116 82 126 88 Q 123 96 115 96 Q 109 94 105 88 Z" fill="#ffffff"/>
    <ellipse cx="115" cy="90" rx="4.8" ry="4.8" fill="#4a3260" stroke="none"/>
    <circle cx="116.5" cy="88.8" r="2.2" fill="#1a0a05" stroke="none"/>
    <circle cx="117.6" cy="87.6" r="0.9" fill="#ffffff" stroke="none"/>
    <line x1="74.5" y1="86.5" x2="76" y2="84"/>
    <line x1="124" y1="84" x2="125.5" y2="86.5"/>
    <!-- Calm brows -->
    <path d="M 73 78 Q 84 73 95 77" stroke-width="2.2"/>
    <path d="M 105 77 Q 116 73 127 78" stroke-width="2.2"/>
    <!-- Nose -->
    <path d="M 100 96 Q 99 107 101 111 Q 103 113 105 111"/>
    <ellipse cx="97" cy="111" rx="1.3" ry="0.9" fill="#2a1a10" fill-opacity="0.45" stroke="none"/>
    <ellipse cx="103.5" cy="111.5" rx="1.3" ry="0.9" fill="#2a1a10" fill-opacity="0.45" stroke="none"/>
    <!-- Knowing, gentle smile -->
    <path d="M 91 121 Q 100 127 109 121" stroke-width="2.2"/>
  </g>

  <circle cx="100" cy="100" r="96" fill="none" stroke="#c6b4e8" stroke-width="3.5"/>
</svg>
