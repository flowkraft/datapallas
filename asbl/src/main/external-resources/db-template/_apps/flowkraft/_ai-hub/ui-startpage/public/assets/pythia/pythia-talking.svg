    <path d="M 140 160 Q 136 220 142 280" stroke-opacity="0.5" stroke-width="1.5"/>
    <path d="M 260 160 Q 264 220 258 280" stroke-opacity="0.5" stroke-width="1.5"/>
    <path d="M 184 240 Q 184 275 175 290"/>
    <path d="M 216 240 Q 216 275 225 290"/>
    <path d="M 158 290 Q 200 285 242 290"/>
    <path d="M 184 291 Q 200 299 216 291 L 210 322 Q 200 328 190 322 Z" stroke-width="1.6" stroke-opacity="0.7"/>
    <path d="M 152 300 L 152 380"/>
    <path d="M 248 300 L 248 380"/>
    <line x1="152" y1="372" x2="248" y2="372"/>
    <line x1="152" y1="381" x2="248" y2="381"/>
    <path d="M 152 381 Q 132 450 122 515"/>
    <path d="M 248 381 Q 268 450 278 515"/>
