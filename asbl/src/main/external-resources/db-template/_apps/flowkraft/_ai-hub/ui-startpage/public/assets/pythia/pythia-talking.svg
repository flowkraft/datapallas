<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 540">
  <!-- Pythia, talking — standing Oracle of Delphi (WordPress CMS portals).
       Same 400x540 skeleton + flat outlined style as mnemosyne-talking.svg
       (skin #fce8d4, ink #2a1a10 w2, gold #d4af37). Identity: violet veil over
       dark hair, gold delphic band with amethyst, long robe, the phiale bowl
       with rising oracle vapors. -->

  <!-- Veil: back drape framing head and shoulders -->
  <path d="M 138 128 Q 134 66 200 60 Q 266 66 262 128 L 268 260 Q 268 292 258 300 L 142 300 Q 132 292 132 260 Z" fill="#9b7ed0"/>

  <!-- Face -->
  <ellipse cx="200" cy="172" rx="55" ry="72" fill="#fce8d4"/>

  <!-- Dark hair peeking under the veil, center-parted -->
  <path d="M 155 130 Q 162 112 200 110 Q 238 112 245 130 Q 222 120 200 120 Q 178 120 155 130 Z" fill="#2a1a10"/>

  <!-- Veil crescent over the crown -->
  <path d="M 142 128 Q 140 74 200 68 Q 260 74 258 128 Q 246 94 200 90 Q 154 94 142 128 Z" fill="#9b7ed0"/>
  <path d="M 200 68 Q 260 74 258 128 Q 250 100 226 92 Q 244 80 200 68 Z" fill="#7a5fc0" fill-opacity="0.5"/>

  <!-- Gold delphic band + amethyst on the veil -->
  <path d="M 150 106 Q 200 86 250 106" stroke="#d4af37" stroke-width="3.5" fill="none"/>
  <circle cx="200" cy="94" r="5" fill="#8b5cf6"/>
  <circle cx="201.5" cy="92.5" r="1.3" fill="#ffffff"/>

  <!-- Neck -->
  <path d="M 184 240 L 184 290 L 216 290 L 216 240 Z" fill="#fce8d4"/>

  <!-- Violet robe with a light under-chiton at the neckline -->
  <path d="M 158 290 Q 200 285 242 290 L 248 380 L 152 380 Z" fill="#8b6fc6"/>
  <path d="M 184 291 Q 200 299 216 291 L 210 322 Q 200 328 190 322 Z" fill="#efe9f9"/>
  <rect x="152" y="372" width="96" height="9" fill="#d4af37" fill-opacity="0.85"/>

  <!-- Long skirt + lighter hem -->
  <path d="M 152 380 Q 132 450 122 515 L 278 515 Q 268 450 248 380 Z" fill="#8b6fc6"/>
  <path d="M 122 505 Q 200 508 278 505 L 278 515 L 122 515 Z" fill="#b9a3e0" fill-opacity="0.85"/>

  <!-- Feet + sandals -->
  <ellipse cx="180" cy="525" rx="13" ry="6" fill="#fce8d4"/>
  <ellipse cx="220" cy="525" rx="13" ry="6" fill="#fce8d4"/>
  <ellipse cx="180" cy="528" rx="14" ry="5" fill="#a87c52"/>
  <ellipse cx="220" cy="528" rx="14" ry="5" fill="#a87c52"/>

  <!-- The phiale (shallow gold bowl) + rising oracle vapors -->
  <ellipse cx="284" cy="392" rx="17" ry="5.5" fill="#d4af37"/>
  <ellipse cx="284" cy="390.5" rx="11" ry="3" fill="#e8d48a"/>
  <path d="M 284 384 Q 276 368 284 352 Q 292 338 286 322" stroke="#b9a3e0" stroke-width="2.5" fill="none" stroke-opacity="0.65"/>
  <path d="M 292 386 Q 300 370 293 355" stroke="#b9a3e0" stroke-width="2.5" fill="none" stroke-opacity="0.55"/>

  <!-- Blush -->
  <ellipse cx="160" cy="200" rx="10" ry="5" fill="#e89080" fill-opacity="0.4"/>
  <ellipse cx="240" cy="200" rx="10" ry="5" fill="#e89080" fill-opacity="0.4"/>

  <g stroke="#2a1a10" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M 138 128 Q 134 66 200 60 Q 266 66 262 128 L 268 260 Q 268 292 258 300"/>
    <path d="M 138 128 L 132 260 Q 132 292 142 300"/>
    <ellipse cx="200" cy="172" rx="55" ry="72"/>
    <path d="M 155 130 Q 162 112 200 110 Q 238 112 245 130" stroke-width="1.6" stroke-opacity="0.8"/>
    <line x1="200" y1="112" x2="200" y2="126" stroke-width="1.4" stroke-opacity="0.6"/>
