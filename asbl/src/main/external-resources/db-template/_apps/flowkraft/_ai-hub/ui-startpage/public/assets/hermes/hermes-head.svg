<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Hermes — messenger god (portals). Winged petasos cap, sky palette.
       Same flat outlined style as athena/mnemosyne-talking.svg:
       skin #fce8d4, ink #2a1a10 w2, blush #e89080, gold #d4af37. -->
  <defs>
    <clipPath id="hermes-disc"><circle cx="100" cy="100" r="96"/></clipPath>
  </defs>

  <circle cx="100" cy="100" r="96" fill="#e6f4fc"/>

  <g clip-path="url(#hermes-disc)">
    <!-- Shoulders / white chiton with sky trim -->
    <path d="M 32 200 Q 38 160 76 148 Q 100 142 124 148 Q 162 160 168 200 Z" fill="#f8f8f0"/>
    <path d="M 76 148 Q 100 158 124 148 L 121 156 Q 100 165 79 156 Z" fill="#78bfe4"/>
    <circle cx="126" cy="152" r="4.5" fill="#d4af37"/>
    <!-- Neck -->
    <path d="M 88 126 L 88 150 Q 100 157 112 150 L 112 126 Z" fill="#fce8d4"/>
    <ellipse cx="100" cy="131" rx="13" ry="5" fill="#f4d8c4"/>
    <!-- Ears -->
    <ellipse cx="61" cy="95" rx="5.5" ry="9" fill="#fce8d4"/>
    <ellipse cx="139" cy="95" rx="5.5" ry="9" fill="#fce8d4"/>
    <!-- Face -->
    <ellipse cx="100" cy="92" rx="38" ry="46" fill="#fce8d4"/>
    <!-- Short brown hair under the cap -->
    <path d="M 62 76 Q 68 62 100 60 Q 132 62 138 76 Q 120 67 100 67 Q 80 67 62 76 Z" fill="#7a5230"/>
    <circle cx="64" cy="82" r="4" fill="#7a5230"/>
    <circle cx="136" cy="82" r="4" fill="#7a5230"/>
    <!-- Petasos: sky dome + brim ridge -->
    <path d="M 56 64 Q 56 28 100 24 Q 144 28 144 64 Q 122 55 100 55 Q 78 55 56 64 Z" fill="#7cc2e6"/>
    <path d="M 100 24 Q 144 28 144 64 Q 130 58 116 56 Q 132 42 100 24 Z" fill="#5da8d2" fill-opacity="0.55"/>
    <path d="M 52 67 Q 100 49 148 67 Q 100 58 52 67 Z" fill="#5da8d2"/>
    <!-- Cap wings (three feathers each temple) -->
    <ellipse cx="44" cy="50" rx="10" ry="3.6" fill="#ffffff" transform="rotate(-52 44 50)"/>
    <ellipse cx="46" cy="57" rx="11" ry="3.6" fill="#ffffff" transform="rotate(-30 46 57)"/>
    <ellipse cx="49" cy="63" rx="10" ry="3.6" fill="#ffffff" transform="rotate(-12 49 63)"/>
    <ellipse cx="156" cy="50" rx="10" ry="3.6" fill="#ffffff" transform="rotate(52 156 50)"/>
    <ellipse cx="154" cy="57" rx="11" ry="3.6" fill="#ffffff" transform="rotate(30 154 57)"/>
    <ellipse cx="151" cy="63" rx="10" ry="3.6" fill="#ffffff" transform="rotate(12 151 63)"/>
    <!-- Blush -->
    <ellipse cx="72" cy="104" rx="7" ry="3.5" fill="#e89080" fill-opacity="0.4"/>
    <ellipse cx="128" cy="104" rx="7" ry="3.5" fill="#e89080" fill-opacity="0.4"/>
  </g>

  <!-- Ink outline pass (same convention as the full-body art) -->
  <g clip-path="url(#hermes-disc)" stroke="#2a1a10" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M 32 200 Q 38 160 76 148 Q 100 142 124 148 Q 162 160 168 200"/>
    <path d="M 76 148 Q 100 158 124 148 L 121 156 Q 100 165 79 156 Z"/>
    <circle cx="126" cy="152" r="4.5"/>
    <path d="M 88 126 L 88 150 Q 100 157 112 150 L 112 126"/>
    <ellipse cx="61" cy="95" rx="5.5" ry="9"/>
    <path d="M 60 92 Q 62 95 61 99" stroke-width="1.3" stroke-opacity="0.6"/>
    <ellipse cx="139" cy="95" rx="5.5" ry="9"/>
    <path d="M 140 92 Q 138 95 139 99" stroke-width="1.3" stroke-opacity="0.6"/>
    <ellipse cx="100" cy="92" rx="38" ry="46"/>
    <path d="M 62 76 Q 68 62 100 60 Q 132 62 138 76"/>
    <path d="M 56 64 Q 56 28 100 24 Q 144 28 144 64"/>
    <path d="M 56 64 Q 78 55 100 55 Q 122 55 144 64"/>
    <path d="M 52 67 Q 100 49 148 67"/>
    <ellipse cx="44" cy="50" rx="10" ry="3.6" transform="rotate(-52 44 50)"/>
    <ellipse cx="46" cy="57" rx="11" ry="3.6" transform="rotate(-30 46 57)"/>
    <ellipse cx="49" cy="63" rx="10" ry="3.6" transform="rotate(-12 49 63)"/>
    <ellipse cx="156" cy="50" rx="10" ry="3.6" transform="rotate(52 156 50)"/>
    <ellipse cx="154" cy="57" rx="11" ry="3.6" transform="rotate(30 154 57)"/>
    <ellipse cx="151" cy="63" rx="10" ry="3.6" transform="rotate(12 151 63)"/>
    <!-- Eyes: white almond + brown iris + pupil + glint -->
    <path d="M 74 88 Q 84 82 95 88 Q 91 96 83 96 Q 77 94 74 88 Z" fill="#ffffff"/>
    <ellipse cx="85" cy="90" rx="4.8" ry="4.8" fill="#5a3825" stroke="none"/>
    <circle cx="86.5" cy="88.8" r="2.2" fill="#1a0a05" stroke="none"/>
    <circle cx="87.6" cy="87.6" r="0.9" fill="#ffffff" stroke="none"/>
    <path d="M 105 88 Q 116 82 126 88 Q 123 96 115 96 Q 109 94 105 88 Z" fill="#ffffff"/>
    <ellipse cx="115" cy="90" rx="4.8" ry="4.8" fill="#5a3825" stroke="none"/>
    <circle cx="116.5" cy="88.8" r="2.2" fill="#1a0a05" stroke="none"/>
    <circle cx="117.6" cy="87.6" r="0.9" fill="#ffffff" stroke="none"/>
    <line x1="74.5" y1="86.5" x2="76" y2="84"/>
    <line x1="124" y1="84" x2="125.5" y2="86.5"/>
    <!-- Brows -->
    <path d="M 72 78 Q 84 72 96 77" stroke-width="2.2"/>
    <path d="M 104 77 Q 116 72 128 78" stroke-width="2.2"/>
    <!-- Nose -->
    <path d="M 100 96 Q 99 107 101 111 Q 103 113 105 111"/>
    <ellipse cx="97" cy="111" rx="1.3" ry="0.9" fill="#2a1a10" fill-opacity="0.45" stroke="none"/>
    <ellipse cx="103.5" cy="111.5" rx="1.3" ry="0.9" fill="#2a1a10" fill-opacity="0.45" stroke="none"/>
    <!-- Friendly smile -->
    <path d="M 90 121 Q 100 128 110 121" stroke-width="2.2"/>
    <!-- Chiton fold hints -->
    <path d="M 66 168 Q 68 184 66 198" stroke-opacity="0.4" stroke-width="1.5"/>
    <path d="M 134 168 Q 132 184 134 198" stroke-opacity="0.4" stroke-width="1.5"/>
  </g>

  <circle cx="100" cy="100" r="96" fill="none" stroke="#9fd0ec" stroke-width="3.5"/>
</svg>
