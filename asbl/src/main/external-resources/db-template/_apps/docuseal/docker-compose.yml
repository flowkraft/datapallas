services:
  docuseal:
    image: docuseal/docuseal:2.2.4
    container_name: rb-docuseal
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${HOST_PORT:-3001}:3000"
    volumes:
      - ./docuseal:/data/docuseal
    environment:
      - FORCE_SSL=${HOST}
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/docuseal
    healthcheck:
      test: ["CMD", "ruby", "-rnet/http", "-e", "exit Net::HTTP.get_response(URI('http://127.0.0.1:3000/')).code.to_i < 500"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  postgres:
    image: postgres:15
    container_name: rb-docuseal-db
    # A database gets a real shutdown window. Compose defaults to 10s and then SIGKILLs, and a
    # hard-killed server replays its write-ahead log on the NEXT boot - so every rushed stop makes
    # the following start slower, which makes the next stop more likely to be rushed. The e2e suite
    # stops and starts these apps repeatedly, so the loop compounds across a run.
    stop_grace_period: 60s
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docuseal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
        - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

# One network for everything DataPallas runs, so the server reaches this app by its container name instead
# of going out to the host and back in through a published port - which any host firewall may block (plan
# §4 F2n). The name is fixed but the network is not 'external': compose creates it when it is missing, so
# this file still works on its own.
networks:
  default:
    name: datapallas
