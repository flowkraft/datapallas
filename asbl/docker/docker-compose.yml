# =============================================================================
# DataPallas Server Docker Compose
# =============================================================================
#
# USAGE:
#   Start:  docker-compose up -d
#   Stop:   docker-compose down
#   Logs:   docker-compose logs -f datapallas-server
#   Shell:  docker-compose exec datapallas-server bash
#
# FIRST RUN:
#   Sign in at http://localhost:9090 with burst / burst, then change that password.
#
# THE BIND MOUNTS BELOW ARE NOT OPTIONAL:
#   Run this compose file from the extracted bundle, which ships ./config, ./db,
#   ./templates and the rest already populated. The entrypoint does NOT seed empty
#   host folders - an empty ./config mounted over /app/config hides the configuration
#   baked into the image and the server comes up broken. To run without the bundle,
#   drop the bind mounts entirely (the image is self-contained) or use named volumes,
#   which Docker does seed from the image on first use.
#
# API KEY:
#   - For machine callers only; the browser UI signs in with a session cookie
#   - Auto-generated on first start, persisted in ./config/_internal/api-key.txt
#   - Or set API_KEY environment variable to use a specific key
#
# =============================================================================

services:
  datapallas-server:
    image: flowkraft/datapallas-server:0.0.0
    container_name: datapallas-server
    ports:
      - "${SERVER_PORT:-9090}:9090"
    environment:
      - SERVER_PORT=9090
      # Optional: where this bundle lives on the host. The server works this out on its own, from the
      # mounts of its own container, so set it only if you mount the bundle in some other way.
      # - DATAPALLAS_HOST_DIR=/path/to/this/folder/on/the/host
      # Optional: Set a specific API key (otherwise auto-generated)
      # - API_KEY=your-secret-api-key-here
    # Enable host.docker.internal on Linux (already available on Docker Desktop for Windows/Mac)
    # This allows the container to reach host-mapped ports for StarterPacks and Apps
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Docker-in-Docker: Required for StarterPacks and Docker Apps
      - /var/run/docker.sock:/var/run/docker.sock
      # Data volumes (persisted on host)
      - ./_apps:/app/_apps
      - ./backup:/app/backup
      - ./config:/app/config
      - ./db:/app/db
      - ./input-files:/app/input-files
      - ./logs:/app/logs
      - ./output:/app/output
      - ./poll:/app/poll
      - ./quarantine:/app/quarantine
      - ./samples:/app/samples
      - ./scripts:/app/scripts
      - ./temp:/app/temp
      - ./templates:/app/templates
      # The JasperReports 6 renderer's extra JDBC drivers. Only this one folder of tools/ is mounted:
      # ./tools:/app/tools would hide the program files the image ships there (plan §3 O19).
      - ./tools/jasper-legacy/lib:/app/tools/jasper-legacy/lib
    restart: unless-stopped
    #healthcheck:
    #  test: ["CMD", "curl", "-f", "http://localhost:9090/api/jobman/system/version"]
    #  interval: 30s
    #  timeout: 10s
    #  retries: 3
    #  start_period: 60s

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    restart: unless-stopped

# One network for everything DataPallas runs, so the server reaches a database or a tool by its container
# name instead of going out to the host and back in through a published port - which any host firewall may
# block (plan §4 F2n). The name is fixed but the network is not 'external': compose creates it when it is
# missing, so this file still works on its own (desktop, or a Server on the host JVM).
networks:
  default:
    name: datapallas
